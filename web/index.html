<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>After Hours</title>
    <meta name="description" content="After Hours: Recurse's chill afternoon. Schedule, polls, hunt, morse, stickers." />
    <meta name="theme-color" content="#f6e7c8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="After Hours" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <style>
      /* Branded launch state while the app boots (replaced by React). Same paper as tokens.css. */
      html, body { margin: 0; background-color: #f6e7c8; overscroll-behavior: none; }
      .boot { min-height: 100dvh; display: grid; place-items: center; align-content: center; gap: 28px; font-family: system-ui, sans-serif; }
      .boot-icon { width: 120px; height: 120px; border-radius: 28px; box-shadow: 6px 8px 0 #1d1630; animation: boot 1.2s ease-in-out infinite alternate; }
      .boot-logo { height: 40px; width: auto; }
      @keyframes boot { from { transform: rotate(-4deg); } to { transform: rotate(4deg) scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { .boot-icon { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="After Hours is loading">
        <img class="boot-icon" src="/icons/icon-192.png" alt="" width="120" height="120" />
        <img class="boot-logo" src="/brand/recurse-logo-black.png" alt="Recurse, KMIT's technical club" />
      </div>
    </div>
    <noscript>After Hours needs JavaScript. Ask at the desk if your phone is being difficult.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
